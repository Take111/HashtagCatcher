name: iOS CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: |
          XCODE_VERSION=$(cat .xcode-version)
          DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version
      - name: Resolve locked packages
        run: |
          xcodebuild -resolvePackageDependencies -workspace HashtagCatcher.xcworkspace \
            -scheme ProductionApp -clonedSourcePackagesDirPath .build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile
      - name: Build Production (Release)
        run: |
          set -o pipefail
          xcodebuild -workspace HashtagCatcher.xcworkspace -scheme ProductionApp \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData -clonedSourcePackagesDirPath .build/SourcePackages \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO build | tee .build/production.log
      - name: Build Staging (Debug)
        run: |
          set -o pipefail
          xcodebuild -workspace HashtagCatcher.xcworkspace -scheme StagingApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData -clonedSourcePackagesDirPath .build/SourcePackages \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO build | tee .build/staging.log
      # Keep the runtime pinned to the version verified with this Xcode toolchain.
      - name: Test package on iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -workspace HashtagCatcher.xcworkspace -scheme HashtagCatcherPackageTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -derivedDataPath .build/DerivedData -clonedSourcePackagesDirPath .build/SourcePackages \
            -resultBundlePath .build/Tests.xcresult -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO test | tee .build/tests.log
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-diagnostics
          # .build/ is a dot-directory; upload-artifact v4 skips hidden paths by default.
          include-hidden-files: true
          path: |
            .build/*.log
            .build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
